version: "1.2"
namespace: sitrep-ui
flags:
  # nimdanitro: flag for rolling out tasks Module, remove after tasks modules is GA
  - key: show-tasks
    name: Show Tasks
    type: BOOLEAN_FLAG_TYPE
    description: Show the task module (Pendenzen)
    enabled: false
    rollouts:
      - segment:
          key: Development
          value: true
  # nimdanitro: flag for rolling out Resources Module, remove after resources modules is GA
  - key: show-resources
    name: Show Resources
    type: BOOLEAN_FLAG_TYPE
    description: Show the resources module (Mittel)
    enabled: false
    rollouts:
      - segment:
          key: Development
          value: true
      - segment:
          key: earlyadopter
          value: true
  # nimdanitro: flag for rolling out new triage view, remove after triage view is GA
  - key: new-triage-view
    name: New Triage View
    type: BOOLEAN_FLAG_TYPE
    description: Show the new dedicated triage view (hides the triage action buttons on messages)
    enabled: false
    rollouts:
      - segment:
          key: Development
          value: true
      - segment:
          key: earlyadopter
          value: true
  # nimdanitro: flag for indicating that it is a sitrep managed instances
  - key: is-sitrep-managed
    name: Sitrep Managed
    type: BOOLEAN_FLAG_TYPE
    description: Indicate that the instance is managed by Sitrep
    enabled: false
    rollouts:
      - segment:
          key: SitrepManaged
          value: true
segments:
  - key: Development
    name: Development
    constraints:
      - type: STRING_COMPARISON_TYPE
        property: domainHash
        operator: isoneof
        value: '["b4c6e989ddba23746750f1954e7f03e87ca54bc28f8540d689b5aa24ea1af5d3","49960de5880e8c687434170f6476605b8fe4aeb9a28632c7995cf3ba831d9763","12ca17b49af2289436f303e0166030a21e525d266e209267433801a8fd4071a0"]'
    match_type: ANY_MATCH_TYPE
  - key: earlyadopter
    name: Early Adopter
    match_type: ANY_MATCH_TYPE
    description: Early adopter segment for testing new features (add with echo "domain.tld.ch" | shasum -a 256)
    constraints:
      - type: STRING_COMPARISON_TYPE
        property: domainHash
        operator: isoneof
        value: '["09a707b7b7040178e8c8c5dc04004445eb17541e1eb7f50606b6f0a7525da2cc"]'
  - key: SitrepManaged
    name: SitrepManaged
    constraints:
      - type: STRING_COMPARISON_TYPE
        property: domain
        operator: suffix
        value: ".sitrep.ch"
    match_type: ANY_MATCH_TYPE
