version: "1.2"
namespace: sitrep-ui
flags:
  # nimdanitro: flag for rolling out tasks Module, remove after tasks modules is GA
  - key: show-tasks
    name: Show Tasks
    type: BOOLEAN_FLAG_TYPE
    description: Show the task module (Pendenzen)
    enabled: false
    rollouts:
      - segment:
          key: Development
          value: true
  # nimdanitro: flag for rolling out Resources Module, remove after resources modules is GA
  - key: show-resources
    name: Show Resources
    type: BOOLEAN_FLAG_TYPE
    description: Show the resources module (Mittel)
    enabled: false
    rollouts:
      - segment:
          key: Development
          value: true
  # nimdanitro: flag for rolling out new triage view, remove after triage view is GA
  - key: new-triage-view
    name: New Triage View
    type: BOOLEAN_FLAG_TYPE
    description: Show the new dedicated triage view (hides the triage action buttons on messages)
    enabled: false
    rollouts:
      - segment:
          key: Development
          value: true
      - segment:
          key: earlyadopter
          value: true
  # nimdanitro: flag for indicating that it is a sitrep managed instances
  - key: is-sitrep-managed
    name: Sitrep Managed
    type: BOOLEAN_FLAG_TYPE
    description: Indicate that the instance is managed by Sitrep
    enabled: false
    rollouts:
      - segment:
          key: SitrepManaged
          value: true
segments:
  - key: Development
    name: Development
    constraints:
      - type: STRING_COMPARISON_TYPE
        property: domain
        operator: isoneof
        value: '["dev.sitrep.ch","localhost","127.0.0.1"]'
    match_type: ALL_MATCH_TYPE
  - key: earlyadopter
    name: Early Adopter
    constraints:
      - type: STRING_COMPARISON_TYPE
        property: domain
        operator: suffix
        value: ".ur.ch"
    match_type: ANY_MATCH_TYPE
  - key: SitrepManaged
    name: SitrepManaged
    constraints:
      - type: STRING_COMPARISON_TYPE
        property: domain
        operator: suffix
        value: ".sitrep.ch"
    match_type: ANY_MATCH_TYPE
