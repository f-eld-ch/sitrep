# SitRep API schema — source of truth for both the Go/gqlgen backend (gqlgen.yml)
# and the TypeScript client (ui/codegen.ts).
#
# Design decisions:
# - Journal is gone: each incident has one log; messages belong directly to the incident.
# - ID everywhere; no uuid/timestamptz/jsonb Hasura scalars.
# - DateTime is RFC 3339 UTC on the wire; the UI mapper converts to Date.
# - Geometry and JSONObject are opaque scalars (passed straight to maplibre/turf).
# - No deletedAt: soft-delete is a storage detail; deleted rows are invisible to the API.
# - closedAt is kept (closing is a domain event the UI renders); closeIncident() takes
#   no client timestamp — the server stamps it to avoid skewed client clocks in audit logs.
# - Flat divisions: [Division!]! on Message — the message_division join table is invisible.
# - triage/priority instead of triageId/priorityId (they were never IDs).
# - Mutations are intent-named (closeIncident, not updateIncident with closedAt).
# - Errors use GraphQL errors with extensions.code, not result unions.
# - Layer carries a revision counter; the UI compares it instead of deep-equal on features.
# - updateFeature is split into moveFeature (geometry) and restyleFeature (properties)
#   so the server can record distinct intents as separate events.

# ─── Scalars ─────────────────────────────────────────────────────────────────

"""RFC 3339 UTC timestamp; maps to Date in TypeScript via the mapper."""
scalar DateTime

"""GeoJSON geometry object; passed opaquely to maplibre-gl / turf."""
scalar Geometry

"""Arbitrary JSON properties bag; passed opaquely to maplibre-gl / turf."""
scalar JSONObject

# ─── Enums ───────────────────────────────────────────────────────────────────

enum Medium {
  RADIO
  PHONE
  EMAIL
  OTHER
}

enum TriageStatus {
  PENDING
  DONE
  MOREINFO
  RESET
}

enum PriorityStatus {
  NORMAL
  HIGH
}

# ─── Domain types ─────────────────────────────────────────────────────────────

type Location {
  name: String!
  coordinates: JSONObject
}

type Division {
  id: ID!
  name: String!
  description: String!
}

type Message {
  id: ID!
  """Sequential number assigned by the server, ordered by recording time."""
  number: Int!
  sender: String!
  senderDetail: String!
  receiver: String!
  receiverDetail: String!
  content: String!
  medium: Medium!
  """Operator-supplied communication time (may differ from createdAt)."""
  time: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
  triage: TriageStatus!
  priority: PriorityStatus!
  """Divisions this message has been triaged to (flat — no join-table wrapper)."""
  divisions: [Division!]!
}

type Incident {
  id: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  closedAt: DateTime
  isClosed: Boolean!
  location: Location
  divisions: [Division!]!
  """All messages for this incident, newest first."""
  messages: [Message!]!
}

type Feature {
  id: ID!
  geometry: Geometry
  properties: JSONObject
}

type Layer {
  id: ID!
  name: String!
  """Revision counter; increments on every feature change. Use for change detection."""
  revision: Int!
  features: [Feature!]!
}

# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  """All non-deleted incidents, newest first."""
  incidents: [Incident!]!

  """Single incident by ID; raises NOT_FOUND if not found or deleted."""
  incident(id: ID!): Incident

  """Single message by ID; used by the triage modal."""
  message(id: ID!): Message

  """All layers for an incident (polled by the map view)."""
  layersForIncident(incidentId: ID!): [Layer!]!
}

# ─── Mutation inputs ──────────────────────────────────────────────────────────

input LayerInput {
  name: String!
}

input DivisionInput {
  name: String!
  description: String!
}

input CreateIncidentInput {
  name: String!
  """Location display name; server creates the Location record."""
  location: String
  divisions: [DivisionInput!]!
  """Map layers to create alongside the incident. Empty → one default layer."""
  layers: [LayerInput!]!
}

input UpdateIncidentInput {
  name: String
  location: String
  divisions: [DivisionInput!]
}

input CreateMessageInput {
  incidentId: ID!
  sender: String!
  receiver: String!
  senderDetail: String!
  receiverDetail: String!
  content: String!
  medium: Medium!
  """Defaults to the server's current time when omitted."""
  time: DateTime
}

input UpdateMessageInput {
  sender: String
  receiver: String
  senderDetail: String
  receiverDetail: String
  content: String
  medium: Medium
  time: DateTime
}

input TriageMessageInput {
  triage: TriageStatus!
  priority: PriorityStatus!
  """IDs of divisions to assign to this message (replaces current set)."""
  divisionIds: [ID!]!
}

# ─── Mutations ────────────────────────────────────────────────────────────────

type Mutation {
  # ── Incidents ───────────────────────────────────────────────────────────────

  """Create an incident with optional divisions and map layers."""
  createIncident(input: CreateIncidentInput!): Incident!

  """Update incident name, location, and/or divisions. Omitted fields are unchanged."""
  updateIncident(id: ID!, input: UpdateIncidentInput!): Incident!

  """
  Close an incident. The server stamps closedAt; no client timestamp accepted.
  Raises ALREADY_CLOSED if already closed.
  """
  closeIncident(id: ID!): Incident!

  """Reopen a closed incident. Raises ALREADY_OPEN if already open."""
  reopenIncident(id: ID!): Incident!

  """
  Delete a closed incident.
  Raises INCIDENT_NOT_CLOSED if still open.
  Raises NOT_FOUND if not found or already deleted.
  """
  deleteIncident(id: ID!): ID!

  # ── Messages ────────────────────────────────────────────────────────────────

  createMessage(input: CreateMessageInput!): Message!
  updateMessage(id: ID!, input: UpdateMessageInput!): Message!

  """
  Atomically set triage status, priority, and division assignments for a message.
  Replaces the full division set in a single operation.
  """
  triageMessage(id: ID!, input: TriageMessageInput!): Message!

  deleteMessage(id: ID!): ID!

  # ── Map / Layers ─────────────────────────────────────────────────────────────

  createLayer(incidentId: ID!, name: String!): Layer!

  """
  Add a GeoJSON feature to a layer.
  id is client-generated (UUID) for optimistic map updates.
  incidentId is required for event-stream routing (Feature is its own aggregate).
  """
  addFeature(incidentId: ID!, layerId: ID!, id: ID!, geometry: Geometry, properties: JSONObject): Feature!

  """Update only the geometry of a feature (e.g. after dragging)."""
  moveFeature(id: ID!, geometry: Geometry!): Feature!

  """Update only the style properties of a feature."""
  restyleFeature(id: ID!, properties: JSONObject!): Feature!

  """Permanently remove a feature."""
  deleteFeature(id: ID!): ID!
}
