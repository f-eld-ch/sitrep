# SitRep API schema — source of truth for both the Go/gqlgen backend (gqlgen.yml)
# and the TypeScript client (ui/codegen.ts).
#
# Design decisions:
# - Journal is gone: each incident has one log; messages belong directly to the incident.
# - ID everywhere; no uuid/timestamptz/jsonb Hasura scalars.
# - DateTime is RFC 3339 UTC on the wire; the UI mapper converts to Date.
# - Geometry and JSONObject are opaque scalars (passed straight to maplibre/turf).
# - No deletedAt: soft-delete is a storage detail; deleted rows are invisible to the API.
# - closedAt is kept (closing is a domain event the UI renders); closeIncident() takes
#   no client timestamp — the server stamps it to avoid skewed client clocks in audit logs.
# - Flat divisions: [Division!]! on Message — the message_division join table is invisible.
# - triage/priority instead of triageId/priorityId (they were never IDs).
# - Mutations are intent-named (closeIncident, not updateIncident with closedAt).
# - Errors use GraphQL errors with extensions.code, not result unions.
# - Layer carries a revision counter; the UI compares it instead of deep-equal on features.
# - updateFeature is split into moveFeature (geometry) and restyleFeature (properties)
#   so the server can record distinct intents as separate events.

# ─── Scalars ─────────────────────────────────────────────────────────────────

"""RFC 3339 UTC timestamp; maps to Date in TypeScript via the mapper."""
scalar DateTime

"""GeoJSON geometry object; passed opaquely to maplibre-gl / turf."""
scalar Geometry

"""Arbitrary JSON properties bag; passed opaquely to maplibre-gl / turf."""
scalar JSONObject

# ─── Enums ───────────────────────────────────────────────────────────────────

enum Medium {
  RADIO
  PHONE
  EMAIL
  OTHER
}

enum TriageStatus {
  PENDING
  DONE
  MOREINFO
  RESET
}

enum PriorityStatus {
  NORMAL
  HIGH
}

enum IncidentAccessMode {
  OPEN_OPERATIONAL
  RESTRICTED
}

enum IncidentRole {
  OWNER
  MANAGER
  EDITOR
  VIEWER
}

enum AccessPrincipalKind {
  USER
  GROUP
  ALL
}

enum GlobalRole {
  SYSTEM_ADMIN
  GROUP_ADMIN
}

type AccessGroup {
  id: ID!
  name: String!
  description: String!
  archivedAt: DateTime
}

type User {
  sub: ID!
  name: String!
  email: String!
}

type GlobalRoleGrant {
  subject: ID!
  role: GlobalRole!
  name: String!
  email: String!
}

type IncidentAccessGrant {
  incidentId: ID!
  principalKind: AccessPrincipalKind!
  principalId: ID!
  principalName: String!
  role: IncidentRole!
}

# ─── Domain types ─────────────────────────────────────────────────────────────

type Location {
  name: String!
  coordinates: JSONObject
}

type Division {
  id: ID!
  name: String!
  description: String!
}

"""A file attached to a message."""
type Attachment {
  id: ID!
  filename: String!
  contentType: String!
  """File size in bytes."""
  size: Int!
  createdAt: DateTime!
  """OIDC subject of the operator who uploaded this attachment."""
  uploadedBy: String!
  """Server-rendered download URL — the UI must never construct this itself."""
  url: String!
}

"""Accumulated casualty counts for a Schadenplatz."""
type Casualties {
  vermisste: Int!
  tote: Int!
  verletzte: Int!
  obdachlose: Int!
  eingeschlossene: Int!
}

"""A geographic damage site owned by an incident."""
type Schadenplatz {
  id: ID!
  incidentId: ID!
  name: String!
  isDefault: Boolean!
  """Raw GeoJSON for this site's boundary / marker, if set."""
  geoJson: String
  casualties: Casualties!
  isMerged: Boolean!
  """ID of the default Schadenplatz this was merged into, if merged."""
  mergedInto: ID
  """Active (non-relieved) resources assigned to this Schadenplatz."""
  resources: [Resource!]!
}

"""The organisational formation type of a resource unit."""
enum ResourceFormation {
  FW
  POL
  ARMEE
  ZS
  TECHNB
  SAN
  OTHER
}

"""Standard Swiss civil-protection unit sizes."""
enum ResourceUnitSize {
  TRUPP
  GRUPPE
  ZUG
  KOMPANIE
  BATAILLON
}

"""Operational state of a resource."""
enum ResourceStatus {
  AUFGEBOTEN
  EINSATZBEREIT
  EINGESETZT
  ABGELOEST
}

"""Communication medium for reaching a resource."""
enum ContactMedium {
  RADIO
  PHONE
  OTHER
}

"""Contact details for a resource."""
type ResourceContact {
  medium: ContactMedium!
  detail: String!
}

"""Named home location with optional coordinates."""
type ResourceHomeLocation {
  name: String!
  lat: Float
  lng: Float
}

"""Precise operational deployment point within a Schadenplatz."""
type DeploymentLocation {
  lat: Float
  lng: Float
  label: String!
}

"""An operational unit assigned to a Schadenplatz."""
type Resource {
  id: ID!
  incidentId: ID!
  schadenplatzId: ID!
  formation: ResourceFormation!
  name: String!
  size: ResourceUnitSize!
  personnelCount: Int!
  hauptaufgabe: String!
  contact: ResourceContact
  homeLocation: ResourceHomeLocation
  deploymentLocation: DeploymentLocation
  status: ResourceStatus!
  statusAt: DateTime!
  alertedAt: DateTime!
  readyAt: DateTime
  deployedAt: DateTime
  stoodDownAt: DateTime
  relievedAt: DateTime
  einsatzBeginn: DateTime
  einsatzEnde: DateTime
  predecessorId: ID
  successorId: ID
  sourceMessageId: ID
}

type Message {
  id: ID!
  """Sequential number assigned by the server, ordered by recording time."""
  number: Int!
  sender: String!
  senderDetail: String!
  receiver: String!
  receiverDetail: String!
  content: String!
  medium: Medium!
  """Operator-supplied communication time (may differ from createdAt)."""
  time: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
  triage: TriageStatus!
  priority: PriorityStatus!
  """Divisions this message has been triaged to (flat — no join-table wrapper)."""
  divisions: [Division!]!
  """Files attached to this message, oldest first."""
  attachments: [Attachment!]!
  """Casualty deltas recorded for each Schadenplatz as part of this message's triage."""
  schadenplatzCasualties: [SchadenplatzCasualtyEntry!]!
  """Resource IDs linked to this message during triage."""
  linkedResourceIds: [ID!]!
}

type Incident {
  id: ID!
  parentId: ID
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  closedAt: DateTime
  isClosed: Boolean!
  location: Location
  divisions: [Division!]!
  """Direct child incidents whose layers bubble up into this incident."""
  childIncidents: [Incident!]!
  """All messages for this incident, newest first."""
  messages: [Message!]!
  """Whether the current user has write access to this incident."""
  canWrite: Boolean!
  """Whether the current user can close or reopen this incident."""
  canManage: Boolean!
  """Whether the current user can delete this incident (owner only)."""
  canDelete: Boolean!
  """Whether the current user can manage access grants for this incident."""
  canManageAccess: Boolean!
  """Access mode of this incident."""
  accessMode: IncidentAccessMode!
  """All non-merged Schadenplätze for this incident."""
  schadenplaetze: [Schadenplatz!]!
  """All resources for this incident, including resources owned by direct child incidents."""
  resources: [Resource!]!
}

type Feature {
  id: ID!
  geometry: Geometry
  properties: JSONObject
}

type Layer {
  id: ID!
  """Incident that owns this layer. Differs from the viewed incident for inherited child layers."""
  sourceIncidentId: ID!
  sourceIncidentName: String!
  name: String!
  """Revision counter; increments on every feature change. Use for change detection."""
  revision: Int!
  features: [Feature!]!
}

# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  """All non-deleted incidents, newest first."""
  incidents: [Incident!]!

  """Single incident by ID; raises NOT_FOUND if not found or deleted."""
  incident(id: ID!): Incident

  """Single message by ID; used by the triage modal."""
  message(id: ID!): Message

  """Visible layers for an incident: its own layers plus direct child incident layers."""
  layersForIncident(incidentId: ID!): [Layer!]!

  incidentAccess(incidentId: ID!): [IncidentAccessGrant!]!
  incidentAccessMode(incidentId: ID!): IncidentAccessMode!
  accessGroups: [AccessGroup!]!
  groupMembers(groupId: ID!): [ID!]!
  users: [User!]!
  globalRoles: [GlobalRoleGrant!]!
  myGlobalRoles: [GlobalRoleGrant!]!

  """Single Schadenplatz by ID."""
  schadenplatz(id: ID!): Schadenplatz

  """Single Resource by ID."""
  resource(id: ID!): Resource
}

# ─── Mutation inputs ──────────────────────────────────────────────────────────

input LayerInput {
  name: String!
}

input DivisionInput {
  """Omit for new divisions; supply the existing ID to preserve assignments."""
  id: ID
  name: String!
  description: String!
}

input CreateIncidentInput {
  name: String!
  """Access mode for the incident; omitted defaults to OPEN_OPERATIONAL."""
  mode: IncidentAccessMode
  """Optional top-level parent incident whose map will include this incident's layers."""
  parentId: ID
  """Location display name; server creates the Location record."""
  location: String
  divisions: [DivisionInput!]!
  """Map layers to create alongside the incident. Empty → one default layer."""
  layers: [LayerInput!]!
}

input UpdateIncidentInput {
  name: String
  location: String
  divisions: [DivisionInput!]
}

input CreateMessageInput {
  incidentId: ID!
  sender: String!
  receiver: String!
  senderDetail: String!
  receiverDetail: String!
  content: String!
  medium: Medium!
  """Defaults to the server's current time when omitted."""
  time: DateTime
}

input UpdateMessageInput {
  sender: String
  receiver: String
  senderDetail: String
  receiverDetail: String
  content: String
  medium: Medium
  time: DateTime
}

input TriageMessageInput {
  triage: TriageStatus!
  priority: PriorityStatus!
  """IDs of divisions to assign to this message (replaces current set)."""
  divisionIds: [ID!]!
  """Casualty deltas to record for each Schadenplatz as part of this triage."""
  schadenplatzCasualties: [SchadenplatzCasualtyInput!]!
  """Resource IDs to link to this message (replaces current set)."""
  linkedResourceIds: [ID!]!
}

input ResourceContactInput {
  medium: ContactMedium!
  detail: String!
}

input ResourceHomeLocationInput {
  name: String!
  lat: Float
  lng: Float
}

input DeploymentLocationInput {
  lat: Float
  lng: Float
  label: String!
}

input AlertResourceInput {
  incidentId: ID!
  """Defaults to the incident's default Schadenplatz when omitted."""
  schadenplatzId: ID
  formation: ResourceFormation!
  name: String!
  size: ResourceUnitSize!
  personnelCount: Int!
  hauptaufgabe: String!
  contact: ResourceContactInput
  homeLocation: ResourceHomeLocationInput
  sourceMessageId: ID
}

input CasualtyDeltasInput {
  vermisste: Int!
  tote: Int!
  verletzte: Int!
  obdachlose: Int!
  eingeschlossene: Int!
}

type SchadenplatzCasualtyEntry {
  schadenplatzId: ID!
  vermisste: Int!
  tote: Int!
  verletzte: Int!
  obdachlose: Int!
  eingeschlossene: Int!
}

input SchadenplatzCasualtyInput {
  schadenplatzId: ID!
  vermisste: Int!
  tote: Int!
  verletzte: Int!
  obdachlose: Int!
  eingeschlossene: Int!
}

# ─── Mutations ────────────────────────────────────────────────────────────────

type Mutation {
  # ── Incidents ───────────────────────────────────────────────────────────────

  """Create an incident with optional divisions and map layers."""
  createIncident(input: CreateIncidentInput!): Incident!

  changeIncidentAccessMode(incidentId: ID!, mode: IncidentAccessMode!): IncidentAccessGrant!
  grantIncidentRole(incidentId: ID!, principalKind: AccessPrincipalKind!, principalId: ID!, role: IncidentRole!): IncidentAccessGrant!
  revokeIncidentRole(incidentId: ID!, principalKind: AccessPrincipalKind!, principalId: ID!, role: IncidentRole!): ID!
  createAccessGroup(name: String!, description: String!): AccessGroup!
  renameAccessGroup(groupId: ID!, name: String!): AccessGroup!
  updateAccessGroupDescription(groupId: ID!, description: String!): AccessGroup!
  archiveAccessGroup(groupId: ID!): ID!
  addGroupMember(groupId: ID!, subject: String!): ID!
  removeGroupMember(groupId: ID!, subject: String!): ID!
  grantGlobalRole(subject: ID!, role: GlobalRole!): ID!
  revokeGlobalRole(subject: ID!, role: GlobalRole!): ID!

  """Update incident name, location, and/or divisions. Omitted fields are unchanged."""
  updateIncident(id: ID!, input: UpdateIncidentInput!): Incident!

  """
  Close an incident. The server stamps closedAt; no client timestamp accepted.
  Raises ALREADY_CLOSED if already closed.
  """
  closeIncident(id: ID!): Incident!

  """Reopen a closed incident. Raises ALREADY_OPEN if already open."""
  reopenIncident(id: ID!): Incident!

  """
  Delete a closed incident.
  Raises INCIDENT_NOT_CLOSED if still open.
  Raises NOT_FOUND if not found or already deleted.
  """
  deleteIncident(id: ID!): ID!

  """Link a child incident to a parent so the child's layers bubble up to the parent."""
  linkIncidentParent(childId: ID!, parentId: ID!): Incident!

  """Remove the parent link from a child incident."""
  unlinkIncidentParent(childId: ID!): Incident!

  # ── Messages ────────────────────────────────────────────────────────────────

  createMessage(input: CreateMessageInput!): Message!
  updateMessage(id: ID!, input: UpdateMessageInput!): Message!

  """
  Atomically set triage status, priority, and division assignments for a message.
  Replaces the full division set in a single operation.
  """
  triageMessage(id: ID!, input: TriageMessageInput!): Message!

  deleteMessage(id: ID!): ID!

  removeAttachment(messageId: ID!, attachmentId: ID!): ID!

  # ── Schadenplatz ─────────────────────────────────────────────────────────────

  """Create a new Schadenplatz for an incident."""
  createSchadenplatz(incidentId: ID!, name: String!): Schadenplatz!

  """Rename a Schadenplatz."""
  renameSchadenplatz(id: ID!, name: String!): Schadenplatz!

  """Set or clear the GeoJSON geometry of a Schadenplatz."""
  setSchadenplatzGeometry(id: ID!, geoJson: String): Schadenplatz!

  """Record casualty deltas (positive or negative) for a Schadenplatz."""
  recordCasualties(id: ID!, sourceMessageId: ID!, input: CasualtyDeltasInput!): Schadenplatz!

  """Merge a Schadenplatz into the incident's default Schadenplatz."""
  mergeSchadenplatz(id: ID!): ID!

  # ── Resources ────────────────────────────────────────────────────────────────

  """Alert (create) a resource and assign it to a Schadenplatz."""
  alertResource(input: AlertResourceInput!): Resource!

  """Mark a resource as ready for deployment (AUFGEBOTEN → EINSATZBEREIT)."""
  markResourceReady(id: ID!, at: DateTime): Resource!

  """Deploy a resource (EINSATZBEREIT → EINGESETZT)."""
  deployResource(id: ID!, at: DateTime): Resource!

  """Stand a resource down temporarily (EINGESETZT → EINSATZBEREIT)."""
  standDownResource(id: ID!, at: DateTime): Resource!

  """Permanently relieve a resource. successorId links the replacing resource."""
  relieveResource(id: ID!, successorId: ID, at: DateTime): Resource!

  """Move a resource to a different Schadenplatz."""
  reassignResource(id: ID!, schadenplatzId: ID!): Resource!

  """Set or clear the precise deployment position of a resource."""
  updateDeploymentLocation(id: ID!, location: DeploymentLocationInput): Resource!

  """Update the primary task description of a resource."""
  changeHauptaufgabe(id: ID!, hauptaufgabe: String!): Resource!

  """Update the contact details of a resource."""
  updateContact(id: ID!, contact: ResourceContactInput!): Resource!

  """Correct the headcount of a resource."""
  updatePersonnelCount(id: ID!, count: Int!): Resource!

  """Record the operational period (Einsatzdauer) for a resource."""
  recordEinsatzDauer(id: ID!, beginn: DateTime!, ende: DateTime): Resource!

  # ── Map / Layers ─────────────────────────────────────────────────────────────

  createLayer(incidentId: ID!, name: String!): Layer!

  """
  Add a GeoJSON feature to a layer.
  id is client-generated (UUID) for optimistic map updates.
  incidentId is required for event-stream routing (Feature is its own aggregate).
  """
  addFeature(incidentId: ID!, layerId: ID!, id: ID!, geometry: Geometry, properties: JSONObject): Feature!

  """
  Update geometry and/or properties of a feature in a single operation.
  Supplying both in one call avoids the optimistic concurrency conflict from two parallel saves.
  """
  modifyFeature(id: ID!, geometry: Geometry, properties: JSONObject): Feature!

  """Permanently remove a feature."""
  deleteFeature(id: ID!): ID!
}
