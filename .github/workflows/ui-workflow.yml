name: UI Build & Test
on:
  workflow_call:
    inputs:
      build:
        description: 'Whether to build the UI'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  ui:
    runs-on: ubuntu-latest
    name: "UI Test and Build"
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          fetch-depth: 0
      
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: yarn
          cache-dependency-path: "ui/yarn.lock"
      
      - name: Install packages
        run: yarn install --immutable
        working-directory: ui
        env:
          # Required to resolve the private @f-eld-ch scope from GitHub Packages
          # (see npmScopes in ui/.yarnrc.yml). The job already grants packages: read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Lint ui files
        run: yarn lint:github
        working-directory: ui

      - name: Typecheck ui
        run: yarn typecheck
        working-directory: ui

      - name: Validate generated types match API schema
        run: yarn codegen:check
        working-directory: ui

      - name: Run ui tests
        run: yarn test --coverage --run
        working-directory: ui
      
      - name: Build ui
        if: inputs.build
        run: yarn build
        working-directory: ui
      
      - name: Upload UI build artifacts
        if: inputs.build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-build
          path: ui/build/
          retention-days: 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-typescript
          path: ui/coverage/cobertura-coverage.xml
