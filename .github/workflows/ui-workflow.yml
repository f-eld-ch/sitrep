name: UI Build & Test
on:
  workflow_call:
    inputs:
      build:
        description: 'Whether to build the UI'
        required: false
        default: false
        type: boolean

permissions: read-all

jobs:
  ui:
    runs-on: ubuntu-latest
    name: "UI Test and Build"
    permissions:
      actions: read
      packages: read  
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: 
          fetch-depth: 0
      
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: yarn
          cache-dependency-path: "ui/yarn.lock"
      
      - name: Install packages
        run: yarn install --immutable
        working-directory: ui
      
      - name: Lint ui files
        run: yarn lint:github
        working-directory: ui
      
      - name: Run ui tests
        run: yarn test --coverage --run
        working-directory: ui
      
      - name: Build ui
        if: inputs.build
        run: yarn build
        working-directory: ui
      
      - name: Upload UI build artifacts
        if: inputs.build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-build
          path: ui/build/
          retention-days: 1

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-typescript
          path: ui/coverage/cobertura-coverage.xml

  upload-coverage-typescript:
    needs: ui
    if: ${{ !cancelled() && needs.ui.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
