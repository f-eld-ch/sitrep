name: Hasura Build & Push
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      push:
        description: 'Whether to push the hasura image'
        required: false
        default: false
        type: boolean

jobs:
  hasura:
    runs-on: ubuntu-24.04-arm
    name: "Build and Push Hasura Image"
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          # Enable driver-specific options for improved caching
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      
      - name: Docker meta for hasura
        id: meta-hasura
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/f-eld-ch/sitrep-hasura
          tags: |
            type=edge,branch=develop
            type=raw,value=stable,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-,enable=true,priority=600
            type=semver,pattern={{version}},prefix=v,priority=420
            type=semver,pattern={{major}}.{{minor}},prefix=v,priority=410
            type=semver,pattern={{major}},prefix=v,priority=400
            type=sha
      
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push hasura image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.hasura
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta-hasura.outputs.tags }}
          labels: ${{ steps.meta-hasura.outputs.labels }}
          # Improved caching configuration with branch-specific scope
          cache-from: |
            type=gha,scope=hasura-${{ github.ref_name }}
            type=gha,scope=hasura-main
          cache-to: type=gha,mode=max,scope=hasura-${{ github.ref_name }}
          # Add provenance and SBOM attestation
          provenance: mode=max
          sbom: true
