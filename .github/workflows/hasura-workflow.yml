name: Hasura Build & Push
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      push:
        description: 'Whether to push the hasura image'
        required: false
        default: false
        type: boolean

jobs:
  hasura:
    runs-on: ubuntu-24.04-arm
    name: "Build and Push Hasura Image"
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # Enable driver-specific options for improved caching
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      
      - name: Docker meta for hasura
        id: meta-hasura
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/f-eld-ch/sitrep-hasura
          tags: |
            type=edge,branch=develop
            type=raw,value=stable,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-,enable=true,priority=600
            type=semver,pattern={{version}},prefix=v,priority=420
            type=semver,pattern={{major}}.{{minor}},prefix=v,priority=410
            type=semver,pattern={{major}},prefix=v,priority=400
            type=sha
      
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push hasura image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.hasura
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta-hasura.outputs.tags }}
          labels: ${{ steps.meta-hasura.outputs.labels }}
          # Improved caching configuration with branch-specific scope
          cache-from: |
            type=gha,scope=hasura-${{ github.ref_name }}
            type=gha,scope=hasura-main
          cache-to: type=gha,mode=max,scope=hasura-${{ github.ref_name }}
          # Add provenance and SBOM attestation
          provenance: mode=max
          sbom: true
