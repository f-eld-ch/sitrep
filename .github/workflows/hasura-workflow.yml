name: Hasura Build & Push
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      push:
        description: 'Whether to push the hasura image'
        required: false
        default: false
        type: boolean

jobs:
  hasura:
    runs-on: ubuntu-24.04-arm
    name: "Build and Push Hasura Image"
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          # Enable driver-specific options for improved caching
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      
      - name: Docker meta for hasura
        id: meta-hasura
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/f-eld-ch/sitrep-hasura
          tags: |
            type=edge,branch=develop
            type=raw,value=stable,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-,enable=true,priority=600
            type=semver,pattern={{version}},prefix=v,priority=420
            type=semver,pattern={{major}}.{{minor}},prefix=v,priority=410
            type=semver,pattern={{major}},prefix=v,priority=400
            type=sha
      
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push hasura image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.hasura
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta-hasura.outputs.tags }}
          labels: ${{ steps.meta-hasura.outputs.labels }}
          # Improved caching configuration with branch-specific scope
          cache-from: |
            type=gha,scope=hasura-${{ github.ref_name }}
            type=gha,scope=hasura-main
          cache-to: type=gha,mode=max,scope=hasura-${{ github.ref_name }}
          # Add provenance and SBOM attestation
          provenance: mode=max
          sbom: true
