name: Build & Test & Push Image
permissions: read-all

on:
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"
jobs:
  featureflags:
    runs-on: ubuntu-24.04
    name: "Validate & Push Feature Flags"
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write    
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: flipt-io/setup-action@773b247ef3b80714f59d127abca9f3d0fd4019e4 # v0.5.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: v1
      - run: flipt validate
      - name: Build and Push bundle
        # only build and push feature flags from the develop branch
        if: github.ref == 'refs/heads/develop'
        env:
          FLIPT_STORAGE_OCI_AUTHENTICATION_USERNAME: ${{ github.actor }}
          FLIPT_STORAGE_OCI_AUTHENTICATION_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flipt bundle build sitrep-featureflags:latest
          flipt bundle push sitrep-featureflags:latest ghcr.io/f-eld-ch/sitrep/featureflags:develop
  
  ui-build:
    name: "UI Build and Test"
    uses: ./.github/workflows/ui-workflow.yml
    with:
      build: true
  
  # Run hasura build in parallel with UI build as it doesn't depend on UI artifacts
  hasura-build:
    name: "Build and Push Hasura Image"
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/hasura-workflow.yml
    with:
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
  
  docker-build:
    name: "Build and Push Sitrep Image"
    needs: ui-build  # Only depends on UI, not on hasura
    uses: ./.github/workflows/docker-workflow.yml
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
    with:
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  upload-coverage-typescript:
    needs: ui-build
    if: ${{ !cancelled() && needs.ui-build.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
