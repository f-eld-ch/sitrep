name: Build & Test & Push Image
permissions:
  actions: write
  contents: read
  packages: write
  id-token: write
on:
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"
jobs:
  featureflags:
    runs-on: ubuntu-24.04
    name: "Validate & Push Feature Flags"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: flipt-io/setup-action@v0.4.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: flipt validate
      - name: Build and Push bundle
        # only build and push feature flags from the develop branch
        if: github.ref == 'refs/heads/develop'
        env:
          FLIPT_STORAGE_OCI_AUTHENTICATION_USERNAME: ${{ github.actor }}
          FLIPT_STORAGE_OCI_AUTHENTICATION_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flipt bundle build sitrep-featureflags:latest
          flipt bundle push sitrep-featureflags:latest ghcr.io/f-eld-ch/sitrep/featureflags:develop
  
  ui-build:
    name: "UI Build and Test"

    uses: ./.github/workflows/ui-workflow.yml
    with:
      build: true
  
  # Run hasura build in parallel with UI build as it doesn't depend on UI artifacts
  hasura-build:
    name: "Build and Push Hasura Image"
    uses: ./.github/workflows/hasura-workflow.yml
    with:
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
  
  docker-build:
    name: "Build and Push Sitrep Image"
    needs: ui-build  # Only depends on UI, not on hasura
    uses: ./.github/workflows/docker-workflow.yml
    with:
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
