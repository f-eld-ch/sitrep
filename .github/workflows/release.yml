name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ui-build:
    name: Build UI
    uses: ./.github/workflows/ui-workflow.yml
    # The called workflow's job requests actions/packages read; a called workflow
    # can never exceed the caller's permissions, so grant them here.
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      build: true

  # A tag is normally cut from a develop commit that main.yml already tested,
  # but nothing guarantees it: the tag push and the branch push race, and a tag
  # can be placed on any commit. Re-running the gates here is what actually
  # blocks a broken release from publishing.
  go-build:
    name: Lint and test Go
    uses: ./.github/workflows/go-workflow.yml
    with:
      coverage: false

  release:
    name: Create GitHub release
    needs: [ui-build, go-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set up Ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download UI build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-build
          path: ui/build/

      # `--current` would range from the previous tag of any kind, so after a
      # candidate the final release would only list what changed since the last
      # rc. Range from the previous stable tag instead, matching the changelog
      # section cliff.toml produces (it ignores rc tags).
      - name: Resolve changelog range
        id: range
        run: |
          current="${GITHUB_REF_NAME}"
          previous="$(git tag --list 'v*' --sort=-v:refname --merged "$current" \
            | grep -vE -- '-(rc|alpha|beta)' \
            | grep -vxF "$current" \
            | head -n1)"
          echo "range=${previous:+$previous..}$current" >> "$GITHUB_OUTPUT"
          echo "Changelog range: ${previous:-<start>}..$current"

      - name: Generate release notes
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: ${{ steps.range.outputs.range }} --strip header --output ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Build binaries, publish image, and create release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch package repository update
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPO_DISPATCH_TOKEN }}
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qE '\-(rc|beta|alpha)'; then
            CHANNEL="testing"
          else
            CHANNEL="stable"
          fi
          gh api repos/f-eld-ch/package-repo/dispatches \
            --method POST \
            -f event_type=new-release \
            -f client_payload[tag]="${GITHUB_REF_NAME}" \
            -f client_payload[channel]="${CHANNEL}"
