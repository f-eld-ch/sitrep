name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ui-build:
    name: Build UI
    uses: ./.github/workflows/ui-workflow.yml
    # The called workflow's job requests actions/packages read; a called workflow
    # can never exceed the caller's permissions, so grant them here.
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      build: true

  # A tag is normally cut from a develop commit that main.yml already tested,
  # but nothing guarantees it: the tag push and the branch push race, and a tag
  # can be placed on any commit. Re-running the gates here is what actually
  # blocks a broken release from publishing.
  go-build:
    name: Lint and test Go
    uses: ./.github/workflows/go-workflow.yml
    with:
      coverage: false

  # Release tags are signed by the maintainer who cuts them (scripts/release.sh runs `git tag -s`).
  # GitHub checks the signature against the signing keys registered on the pusher's account, so
  # "verified" here means a known maintainer created this exact tag. A lightweight or unverified
  # tag stops the release before anything is built or published.
  verify-tag:
    name: Verify the tag signature
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check that the tag is signed and verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          if [ "$(jq -r .object.type <<<"$ref")" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag. Cut releases with scripts/release.sh, which signs the tag (git tag -s)."
            exit 1
          fi
          verification="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification)"
          if [ "$(jq -r .verified <<<"$verification")" != "true" ]; then
            echo "::error::The signature of ${TAG} is not verified by GitHub (reason: $(jq -r .reason <<<"$verification")). Register your signing key at https://github.com/settings/keys as a signing key."
            exit 1
          fi
          echo "${TAG} is signed and verified."

  release:
    name: Create GitHub release
    needs: [verify-tag, ui-build, go-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # keyless cosign signing and build provenance
      attestations: write # build provenance attestations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set up Ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download UI build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-build
          path: ui/build/

      # `--current` would range from the previous tag of any kind, so after a
      # candidate the final release would only list what changed since the last
      # rc. Range from the previous stable tag instead, matching the changelog
      # section cliff.toml produces (it ignores rc tags).
      - name: Resolve changelog range
        id: range
        run: |
          current="${GITHUB_REF_NAME}"
          previous="$(git tag --list 'v*' --sort=-v:refname --merged "$current" \
            | grep -vE -- '-(rc|alpha|beta)' \
            | grep -vxF "$current" \
            | head -n1)"
          echo "range=${previous:+$previous..}$current" >> "$GITHUB_OUTPUT"
          echo "Changelog range: ${previous:-<start>}..$current"

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: ${{ steps.range.outputs.range }} --strip header --output ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      # goreleaser calls syft to create the SBOMs (see `sboms:` in .goreleaser.yaml).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # goreleaser calls cosign to sign checksums.txt (see `signs:` in .goreleaser.yaml).
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build binaries, publish image, and create release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser has already signed the image (`docker_signs:` in .goreleaser.yaml). Take the
      # digest it recorded for the manifest ko pushed, so the attestation below refers to exactly
      # that image.
      - name: Resolve the image digest
        id: image
        run: |
          digest="$(jq -r --arg image "ghcr.io/${GITHUB_REPOSITORY}" \
            '[.[] | select((.extra.Digest // "") != "" and (.name | startswith($image))) | .extra.Digest] | unique | .[]' \
            dist/artifacts.json)"
          if [ "$(wc -l <<<"$digest")" -ne 1 ] || [ -z "$digest" ]; then
            echo "::error::expected exactly one image digest in dist/artifacts.json, found: ${digest:-none}"
            jq -c '.[] | select(.type | test("Docker"; "i")) | {name, type, extra}' dist/artifacts.json
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance of the release files
        id: attest-files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/*.sbom.json

      - name: Attest build provenance of the container image
        id: attest-image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # GitHub stores the attestations itself, but OpenSSF Scorecard (Signed-Releases) and offline
      # verification look for provenance files among the release assets: *.intoto.jsonl.
      - name: Attach the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES_BUNDLE: ${{ steps.attest-files.outputs.bundle-path }}
          IMAGE_BUNDLE: ${{ steps.attest-image.outputs.bundle-path }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "$FILES_BUNDLE" "$RUNNER_TEMP/sitrep_${version}.intoto.jsonl"
          cp "$IMAGE_BUNDLE" "$RUNNER_TEMP/sitrep-image_${version}.intoto.jsonl"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/sitrep_${version}.intoto.jsonl" \
            "$RUNNER_TEMP/sitrep-image_${version}.intoto.jsonl"

      - name: Dispatch package repository update
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPO_DISPATCH_TOKEN }}
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qE '\-(rc|beta|alpha)'; then
            CHANNEL="testing"
          else
            CHANNEL="stable"
          fi
          gh api repos/f-eld-ch/package-repo/dispatches \
            --method POST \
            -f event_type=new-release \
            -f client_payload[tag]="${GITHUB_REF_NAME}" \
            -f client_payload[channel]="${CHANNEL}"

      # The release above is created with GITHUB_TOKEN, and GitHub does not start other workflows
      # from events that token causes, so a `release: published` workflow never runs. Call the hook
      # here instead, once the release exists, so the changelog on sitrep.ch picks it up.
      - name: Rebuild sitrep.ch
        env:
          DEPLOY_HOOK_URL: ${{ secrets.SITREP_CH_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
