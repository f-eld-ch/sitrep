name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ui-build:
    name: Build UI
    uses: ./.github/workflows/ui-workflow.yml
    # The called workflow's job requests actions/packages read; a called workflow
    # can never exceed the caller's permissions, so grant them here.
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      build: true

  release:
    name: Create GitHub release
    needs: ui-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set up Ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download UI build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-build
          path: ui/build/

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --current --strip header --output ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Build binaries, publish image, and create release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch package repository update
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPO_DISPATCH_TOKEN }}
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qE '\-(rc|beta|alpha)'; then
            CHANNEL="testing"
          else
            CHANNEL="stable"
          fi
          gh api repos/f-eld-ch/package-repo/dispatches \
            --method POST \
            -f event_type=new-release \
            -f client_payload[tag]="${GITHUB_REF_NAME}" \
            -f client_payload[channel]="${CHANNEL}"
