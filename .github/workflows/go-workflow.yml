name: Go Build & Test

on:
  workflow_call:
    inputs:
      coverage:
        description: "Whether to produce and upload the coverage artifact"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    name: "Go Lint and Test"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      # ui.Assets embeds ui/build, so the packages fail to compile without it.
      # A placeholder keeps this job independent of the UI build, so the two run
      # in parallel; nothing here asserts on the served assets.
      - name: Create placeholder UI build dir
        run: mkdir -p ui/build && echo "placeholder" > ui/build/placeholder

      - name: Install Go dependencies
        run: go mod download

      - name: Install Go Linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
          version: v2.14.0

      # --diff reports and fails; a bare `fmt` rewrites the checkout and exits 0,
      # which never fails a build.
      - name: Go Format
        run: golangci-lint fmt --diff ./...

      - name: Go Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m ./...

      # The tests start PostgreSQL containers (see internal/testutil/pgtest). Several test binaries run at
      # once, and pulling the image concurrently from Docker Hub made connections reset, so pull it once
      # up front, with retries. Keep the image in line with `image` in pgtest.go.
      - name: Pull the PostgreSQL test image
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull postgres:17-alpine && exit 0
            echo "pull failed (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Go Test
        env:
          # The reaper container removes containers if the test process is killed; it is one more image
          # to pull from Docker Hub, and the runner is discarded after the job anyway.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        # -coverpkg=./... credits a test for the code it runs in any package, not only its own:
        # the resolver and service tests drive the domain and the adapters. The profile then holds
        # every block once per test binary; gocover-cobertura adds the hits up per line, so a line
        # counts as covered when any of them ran it.
        # -race runs the tests under the race detector, which is the project's dynamic analysis
        # (coverage is then recorded in atomic mode).
        # -tags integration also runs the tests that need PostgreSQL: they start their own container with
        # testcontainers (the runner has Docker), so no database service is configured here.
        run: go test -tags integration -race -coverpkg=./... -coverprofile=go-coverage.out ./...

      - name: Convert Go coverage to Cobertura
        if: inputs.coverage
        run: |
          go install github.com/boumenot/gocover-cobertura@4afa1205ab3b54ae098dd4724c1657aad10f7484
          # Generated code (gqlgen's generated.go) is not ours to test; leaving it in roughly
          # halves the reported coverage. -ignore-gen-files drops files with a "Code generated ...
          # DO NOT EDIT." header.
          gocover-cobertura -ignore-gen-files < go-coverage.out > go-cobertura.xml

      - name: Upload Go coverage artifact
        if: inputs.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-go
          path: go-cobertura.xml
