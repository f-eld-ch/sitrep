name: Docker Build & Push
on:
  workflow_call:
    inputs:
      push:
        description: 'Whether to push the Docker images'
        required: false
        default: false
        type: boolean

jobs:
  docker:
    runs-on: ubuntu-24.04-arm
    name: "Build and Push Sitrep Image"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Enable driver-specific options for improved caching
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      
      - name: Download UI build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui/build/
      
      - name: Docker meta for main app
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/f-eld-ch/sitrep
          tags: |
            # set latest tag for default branch / ordered by priority
            type=semver,pattern={{version}},prefix=v,priority=920
            type=raw,value=stable,enable=${{ github.ref == format('refs/heads/{0}', 'main') }},priority=910
            type=raw,value=develop,enable={{is_default_branch}},priority=905
            # priority 900
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            # priority 700
            type=edge,branch=develop
            # priority 600
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-,enable=true
      
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push sitrep image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          # Improved caching configuration
          cache-from: |
            type=gha,scope=sitrep-${{ github.ref_name }}
            type=gha,scope=sitrep-main
          cache-to: type=gha,mode=max,scope=sitrep-${{ github.ref_name }}
          # Add provenance and SBOM attestation
          provenance: mode=max
          sbom: true
          # Optimized build arguments
          build-args: |
            VERSION=${{ fromJSON(steps.meta-app.outputs.json).labels['org.opencontainers.image.version'] || 'dev' }}
            GIT_SHA=${{ github.sha }}
            BUILDTIME=${{ fromJSON(steps.meta-app.outputs.json).labels['org.opencontainers.image.created'] }}
