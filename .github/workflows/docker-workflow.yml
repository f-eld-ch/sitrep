name: Docker Build & Push
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      push:
        description: 'Whether to push the Docker images'
        required: false
        default: false
        type: boolean

jobs:
  docker:
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04-arm
    name: "Build and Push Sitrep Image"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          # Enable driver-specific options for improved caching
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      
      - name: Download UI build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-build
          path: ui/build/
      
      - name: Docker meta for main app
        id: meta-app
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/f-eld-ch/sitrep
          tags: |
            # set latest tag for default branch / ordered by priority
            type=semver,pattern={{version}},prefix=v,priority=920
            type=raw,value=stable,enable=${{ github.ref == format('refs/heads/{0}', 'main') }},priority=910
            type=raw,value=develop,enable={{is_default_branch}},priority=905
            # priority 900
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            # priority 700
            type=edge,branch=develop
            # priority 600
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-,enable=true
      
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push sitrep image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: ${{ inputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          # Improved caching configuration
          cache-from: |
            type=gha,scope=sitrep-${{ github.ref_name }}
            type=gha,scope=sitrep-main
          cache-to: type=gha,mode=max,scope=sitrep-${{ github.ref_name }}
          # Add provenance and SBOM attestation
          provenance: mode=max
          sbom: true
          # Optimized build arguments
          build-args: |
            VERSION=${{ fromJSON(steps.meta-app.outputs.json).labels['org.opencontainers.image.version'] || 'dev' }}
            GIT_SHA=${{ github.sha }}
            BUILDTIME=${{ fromJSON(steps.meta-app.outputs.json).labels['org.opencontainers.image.created'] }}
