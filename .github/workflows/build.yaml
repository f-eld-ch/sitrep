name: Automated Tests and Linting
permissions: read-all
on:
  push:
    branches-ignore:
      - "main"
      - "develop"
jobs:
  ui-tests:
    name: "UI Tests Only"
    uses: ./.github/workflows/ui-workflow.yml
    with:
      build: false
  upload-coverage-typescript:
    needs: ui-tests
    if: ${{ !cancelled() && needs.ui-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent

  go-tests:
    runs-on: ubuntu-latest
    name: "Go Tests"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"

      - name: Create placeholder UI build dir
        run: mkdir -p ui/build && echo "placeholder" > ui/build/placeholder

      - name: Install Go dependencies
        run: go mod download

      - name: Go Test
        run: go test -coverprofile=go-coverage.out ./...

      - name: Convert Go coverage to Cobertura
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          gocover-cobertura < go-coverage.out > go-cobertura.xml

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-go
          path: go-cobertura.xml

  upload-coverage-go:
    needs: go-tests
    if: ${{ !cancelled() && needs.go-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download Go coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-go
      - uses: actions/upload-code-coverage@v1
        with:
          file: go-cobertura.xml
          language: Go
          label: code-coverage-agent
