name: Automated Tests and Linting
permissions: read-all
on:
  push:
    branches-ignore:
      - "main"
      - "develop"
jobs:
  ui-tests:
    name: "UI Tests Only"
    uses: ./.github/workflows/ui-workflow.yml
    with:
      build: false
  upload-coverage-typescript:
    needs: ui-tests
    if: ${{ !cancelled() && needs.ui-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report-typescript
      - uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent

  go-tests:
    runs-on: ubuntu-latest
    name: "Go Tests"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Create placeholder UI build dir
        run: mkdir -p ui/build && echo "placeholder" > ui/build/placeholder

      - name: Install Go dependencies
        run: go mod download

      - name: Go Test
        run: go test -coverprofile=go-coverage.out ./...

      - name: Convert Go coverage to Cobertura
        run: |
          go install github.com/boumenot/gocover-cobertura@4afa1205ab3b54ae098dd4724c1657aad10f7484
          gocover-cobertura < go-coverage.out > go-cobertura.xml

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-go
          path: go-cobertura.xml

  upload-coverage-go:
    needs: go-tests
    if: ${{ !cancelled() && needs.go-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download Go coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report-go
      - uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: go-cobertura.xml
          language: Go
          label: code-coverage-agent
