version: 2

project_name: sitrep

builds:
  - id: sitrep
    main: .
    binary: sitrep
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.sha={{ .FullCommit }}

archives:
  - formats: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: sitrep
    ids:
      - sitrep
    package_name: sitrep
    vendor: f-eld.ch
    homepage: "https://github.com/f-eld-ch/sitrep"
    maintainer: "Verein F-ELD <info@f-eld.ch>"
    description: |-
      SitRep: Digitale Lagebewirtschaftung für Führungsstäbe.
      Single binary serving the API and the embedded web UI.
    license: AGPL-3.0-or-later
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Postgres is reachable over the network, so it is not a package dependency.
    dependencies:
      - systemd
    contents:
      - src: LICENSE
        dst: /usr/share/doc/sitrep/LICENSE
      - src: README.md
        dst: /usr/share/doc/sitrep/README.md
      # Root-owned: systemd reads it and passes it to the sandbox as a credential.
      - dst: /etc/sitrep
        type: dir
        file_info:
          mode: 0700
      # Drop-off point for a static TLS key pair; empty unless an operator uses one.
      - dst: /etc/sitrep/tls
        type: dir
        file_info:
          mode: 0700
      - src: packaging/config.yaml
        dst: /etc/sitrep/config.yaml
        type: "config|noreplace"
        file_info:
          mode: 0600
      - src: packaging/sitrep.service
        dst: /usr/lib/systemd/system/sitrep.service
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    rpm:
      group: Applications/Internet

snapshot:
  version_template: "{{ incpatch .Version }}-beta.1+{{ .ShortCommit }}"

kos:
  - id: sitrep
    build: sitrep
    repositories:
      - ghcr.io/f-eld-ch/sitrep
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ if .IsSnapshot }}develop{{end}}"
      - "{{ if not .IsSnapshot }}v{{ .Version }}{{end}}"
      - "{{ if not .IsSnapshot }}v{{ .Major }}.{{ .Minor }}{{end}}"
      - "{{ if not .IsSnapshot }}v{{ .Major }}{{end}}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}stable{{ end }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}latest{{ end }}"
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    labels:
      org.opencontainers.image.created: "{{ .CommitTimestamp }}"
      org.opencontainers.image.description: "SitRep: Digitale Lagebewirtschaftung für Führungsstäbe"
      org.opencontainers.image.licenses: "AGPL-3.0"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/f-eld-ch/sitrep"
      org.opencontainers.image.title: "sitrep"
      org.opencontainers.image.url: "https://github.com/f-eld-ch/sitrep"
      org.opencontainers.image.version: "v{{ .Version }}"
    annotations:
      manifest:org.opencontainers.image.created: "{{ .CommitTimestamp }}"
      manifest:org.opencontainers.image.description: "SitRep: Digitale Lagebewirtschaftung für Führungsstäbe"
      manifest:org.opencontainers.image.licenses: "AGPL-3.0"
      manifest:org.opencontainers.image.revision: "{{ .FullCommit }}"
      manifest:org.opencontainers.image.source: "https://github.com/f-eld-ch/sitrep"
      manifest:org.opencontainers.image.title: sitrep
      manifest:org.opencontainers.image.url: "https://github.com/f-eld-ch/sitrep"
      manifest:org.opencontainers.image.version: "v{{ .Version }}"
    bare: true
    preserve_import_paths: false

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
  make_latest: "{{ not .Prerelease }}"
  mode: replace
  preflight:
    fail_on_error: true
