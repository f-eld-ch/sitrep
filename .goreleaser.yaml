version: 2

project_name: sitrep

builds:
  - id: sitrep
    main: .
    binary: sitrep
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.sha={{ .FullCommit }} -X main.otelEndpoint=https://telemetry.sitrep.ch -X main.otelEnvironment=self-hosted

archives:
  - formats: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: sitrep
    ids:
      - sitrep
    package_name: sitrep
    vendor: f-eld.ch
    homepage: "https://github.com/f-eld-ch/sitrep"
    maintainer: "Verein F-ELD <info@f-eld.ch>"
    description: |-
      SitRep: Digitale Lagebewirtschaftung für Führungsstäbe.
      Single binary serving the API and the embedded web UI.
    license: AGPL-3.0-or-later
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Postgres is reachable over the network, so it is not a package dependency.
    dependencies:
      - systemd
    contents:
      - src: LICENSE
        dst: /usr/share/doc/sitrep/LICENSE
      - src: README.md
        dst: /usr/share/doc/sitrep/README.md
      # Root-owned: systemd reads it and passes it to the sandbox as a credential.
      - dst: /etc/sitrep
        type: dir
        file_info:
          mode: 0700
      # Drop-off point for a static TLS key pair; empty unless an operator uses one.
      - dst: /etc/sitrep/tls
        type: dir
        file_info:
          mode: 0700
      - src: packaging/config.yaml
        dst: /etc/sitrep/config.yaml
        type: "config|noreplace"
        file_info:
          mode: 0600
      - src: packaging/sitrep.service
        dst: /usr/lib/systemd/system/sitrep.service
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    rpm:
      group: Applications/Internet

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot.{{ .Now.Format "20060102150405" }}+{{ .ShortCommit }}'

kos:
  - id: sitrep
    build: sitrep
    repositories:
      - ghcr.io/f-eld-ch/sitrep
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      # Rolling tags stay on the newest stable release; a pre-release publishes
      # only its exact version so it can never be pulled by accident.
      - "git-{{ .ShortCommit }}"
      - "{{ if not .IsSnapshot }}v{{ .Version }}{{end}}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}v{{ .Major }}.{{ .Minor }}{{end}}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}v{{ .Major }}{{end}}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}stable{{ end }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}latest{{ end }}"
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    labels:
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.description: "SitRep: Digitale Lagebewirtschaftung für Führungsstäbe"
      org.opencontainers.image.licenses: "AGPL-3.0-or-later"
      org.opencontainers.image.vendor: "Verein F-ELD"
      org.opencontainers.image.authors: "Verein F-ELD <info@f-eld.ch>"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/f-eld-ch/sitrep"
      org.opencontainers.image.title: "sitrep"
      org.opencontainers.image.url: "https://github.com/f-eld-ch/sitrep"
      org.opencontainers.image.version: "v{{ .Version }}"
    annotations:
      manifest:org.opencontainers.image.created: "{{ .CommitDate }}"
      manifest:org.opencontainers.image.description: "SitRep: Digitale Lagebewirtschaftung für Führungsstäbe"
      manifest:org.opencontainers.image.licenses: "AGPL-3.0-or-later"
      manifest:org.opencontainers.image.vendor: "Verein F-ELD"
      manifest:org.opencontainers.image.authors: "Verein F-ELD <info@f-eld.ch>"
      manifest:org.opencontainers.image.revision: "{{ .FullCommit }}"
      manifest:org.opencontainers.image.source: "https://github.com/f-eld-ch/sitrep"
      manifest:org.opencontainers.image.title: sitrep
      manifest:org.opencontainers.image.url: "https://github.com/f-eld-ch/sitrep"
      manifest:org.opencontainers.image.version: "v{{ .Version }}"
    bare: true
    preserve_import_paths: false

checksum:
  name_template: checksums.txt

# Software bills of materials (SPDX JSON, generated by syft, which the workflow installs). They are
# listed in checksums.txt, so the checksum signature covers them too.
#  - one per archive: the Go modules compiled into the binary
#  - one for the web UI: the npm packages in ui/yarn.lock, which are compiled into the embedded UI
#    and therefore do not appear in the Go binary's SBOM. The lock file does not distinguish
#    development from runtime dependencies, so build-only tools are listed as well.
# The container image's SBOM is created by ko (kos: sbom, default spdx) and pushed to the registry.
sboms:
  - id: archives
    artifacts: archive
  - id: ui
    artifacts: any
    documents:
      - sitrep-ui_{{ .Version }}.sbom.json
    cmd: syft
    args:
      - dir:ui
      - --source-name=sitrep-ui
      - --source-version={{ .Version }}
      - --exclude=./build/**
      - --output=spdx-json=$document

# Keyless signature (Sigstore) over the checksum file. checksums.txt lists every archive and
# package, so one signature covers all of them. Needs cosign on the PATH and the workflow's
# OIDC token (id-token: write); the signing identity is the release workflow, recorded in the
# public Rekor log. Verification is documented in docs/administrator/verify-releases.md.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

# Keyless signature over the image manifest ko pushes (ko adds its manifests to the artifact list).
# The default arguments expect a key file, so they are replaced. The digest is the multi-arch
# manifest, so one signature covers every platform.
docker_signs:
  - id: image
    cmd: cosign
    artifacts: manifests
    args:
      - sign
      - --yes
      - ${artifact}@${digest}
    output: true

release:
  prerelease: auto
  make_latest: "{{ not .Prerelease }}"
  mode: replace
  preflight:
    fail_on_error: true
