version: "2"
linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # The domain centre must be pure: no infrastructure imports.
        domain-pure:
          files:
            - "**/internal/core/domain/**/*.go"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "domain must not import pgx — use ports"
            - pkg: "github.com/labstack/echo"
              desc: "domain must not import echo — use ports"
            - pkg: "github.com/99designs/gqlgen"
              desc: "domain must not import gqlgen — use ports"
            - pkg: "go.opentelemetry.io/otel"
              desc: "domain must not import otel directly — instrument at service/adapter layer"
            - pkg: "github.com/pressly/goose"
              desc: "domain must not import goose"
            - pkg: "github.com/f-eld-ch/sitrep/internal/adapter"
              desc: "domain must not import adapters"
        # Ports may only depend on domain and stdlib/uuid.
        ports-clean:
          files:
            - "**/internal/core/port/**/*.go"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "ports must not import pgx"
            - pkg: "github.com/labstack/echo"
              desc: "ports must not import echo"
            - pkg: "github.com/f-eld-ch/sitrep/internal/adapter"
              desc: "ports must not import adapters"
        # Application services may not import adapters directly.
        services-no-adapters:
          files:
            - "**/internal/core/service/**/*.go"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "services must not import pgx — depend on port interfaces"
            - pkg: "github.com/labstack/echo"
              desc: "services must not import echo"
            - pkg: "github.com/f-eld-ch/sitrep/internal/adapter"
              desc: "services must not import adapters directly"
        # Inbound adapters (GraphQL, CLI) must not reach into outbound adapters directly.
        inbound-no-outbound:
          files:
            - "**/internal/adapter/inbound/**/*.go"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "inbound adapters must not import pgx — use outbound port interfaces"
            - pkg: "github.com/f-eld-ch/sitrep/internal/adapter/outbound"
              desc: "inbound adapters must not import outbound adapters directly"
        # Migrations may import domain event types but not ports or adapters.
        migrations-scope:
          files:
            - "**/migrations/**/*.go"
          deny:
            - pkg: "github.com/f-eld-ch/sitrep/internal/core/port"
              desc: "migrations must not import ports"
            - pkg: "github.com/f-eld-ch/sitrep/internal/adapter"
              desc: "migrations must not import adapters"
            - pkg: "github.com/labstack/echo"
              desc: "migrations must not import echo"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - blank
        - dot
        - alias
        - default
        - prefix(github.com/f-eld-ch)
        - localmodule
      no-inline-comments: true
      no-prefix-comments: true
      custom-order: true
      no-lex-order: true
