version: "2"
linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - noctx
    - errorlint
    - exhaustive
    - exptostd
    - gomodguard_v2
    - gomoddirectives
    - gosec
    - iface
    - interfacebloat
    - intrange
    - makezero
    - nolintlint
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - predeclared
    - promlinter
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - sloglint
    - spancheck
    - testifylint
    - thelper
    - unconvert
    - unqueryvet
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
  exclusions:
    rules:
      - path: internal/cli/otel.go
        linters:
          - contextcheck
      - path: server/server.go
        linters:
          - contextcheck
          - gosec
      - path: internal/platform/identity/context_test.go
        linters:
          - containedctx
      - path: internal/cli/migrate_test.go
        linters:
          - nilnil
      - path: migrations/00004_import.go
        linters:
          - sqlclosecheck
  settings:
    depguard:
      rules:
        # The domain centre must be pure: no infrastructure imports.
        domain-pure:
          files:
            - "**/internal/core/domain/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/f-eld-ch/sitrep/internal/core/domain
            - github.com/f-eld-ch/sitrep/internal/eventsourcing
            - github.com/google/uuid
        # Ports may only depend on domain and stdlib/uuid.
        ports-clean:
          files:
            - "**/internal/core/port/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/f-eld-ch/sitrep/internal/core/domain
            - github.com/f-eld-ch/sitrep/internal/eventsourcing
            - github.com/f-eld-ch/sitrep/internal/platform/identity
            - github.com/google/uuid
        # Application services may not import adapters directly.
        services-no-adapters:
          files:
            - "**/internal/core/service/**/*.go"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "services must not import pgx — depend on port interfaces"
            - pkg: "github.com/labstack/echo"
              desc: "services must not import echo"
            - pkg: "github.com/f-eld-ch/sitrep/internal/adapter"
              desc: "services must not import adapters directly"
        # Inbound adapters (GraphQL, CLI) must not reach into outbound adapters directly.
        # Test files are excluded: they act as composition roots and must wire both sides.
        inbound-no-outbound:
          files:
            - "**/internal/adapter/inbound/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "inbound adapters must not import pgx — use outbound port interfaces"
            - pkg: "github.com/f-eld-ch/sitrep/internal/adapter/outbound"
              desc: "inbound adapters must not import outbound adapters directly"
        # Migrations may import domain event types but not ports or adapters.
        migrations-scope:
          files:
            - "**/migrations/**/*.go"
          deny:
            - pkg: "github.com/f-eld-ch/sitrep/internal/core/port"
              desc: "migrations must not import ports"
            - pkg: "github.com/f-eld-ch/sitrep/internal/adapter"
              desc: "migrations must not import adapters"
            - pkg: "github.com/labstack/echo"
              desc: "migrations must not import echo"
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead, see https://go.dev/blog/randv2
    ireturn:
      allow:
        - anon
        - empty
        - error
        - stdlib
        - github.com/99designs/gqlgen/graphql.Marshaler
        - 'github.com/f-eld-ch/sitrep/internal/adapter/inbound/graphql/generated\..+Resolver'
        - 'github.com/f-eld-ch/sitrep/internal/core/port/inbound\..+Service'
        - github.com/jackc/pgx/v5.Tx
        - go.opentelemetry.io/otel/propagation.TextMapPropagator
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      context: scope
      key-naming-case: snake
      msg-style: lowercased
      static-msg: true
    spancheck:
      checks:
        - end
        - record-error
        - set-status
      ignore-check-signatures:
        - recordSpanError
    wrapcheck:
      ignore-package-globs:
        - github.com/f-eld-ch/sitrep/internal/core/domain/*
        - github.com/f-eld-ch/sitrep/internal/core/port/*
      ignore-sig-regexps:
        - github.com/google/uuid\.UUID\.(MarshalText|UnmarshalText)\(

formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
    gofumpt:
      module-path: github.com/f-eld-ch/sitrep
    gci:
      sections:
        - standard
        - blank
        - dot
        - alias
        - default
        - prefix(github.com/f-eld-ch)
        - localmodule
      no-inline-comments: true
      no-prefix-comments: true
      custom-order: true
      no-lex-order: true
