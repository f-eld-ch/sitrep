schema:
  - api/schema.graphql

exec:
  filename: internal/adapter/inbound/graphql/generated/generated.go
  package: generated

model:
  filename: internal/adapter/inbound/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/adapter/inbound/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

autobind: []

models:
  DateTime:
    model: github.com/99designs/gqlgen/graphql.Time
  Geometry:
    model: github.com/f-eld-ch/sitrep/internal/adapter/inbound/graphql/scalar.JSONMap
  JSONObject:
    model: github.com/f-eld-ch/sitrep/internal/adapter/inbound/graphql/scalar.JSONMap
  Incident:
    fields:
      childIncidents:
        resolver: true
      messages:
        resolver: true

