{{- if and (include "sitrep.createSecret" .) (or .Values.database.postgres.url .Values.secrets.oidcClientSecret .Values.secrets.cookieKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sitrep.secretName" . }}
  labels:
    {{- include "sitrep.labels" . | nindent 4 }}
  {{- if eq (include "sitrep.migrationMode" .) "job" }}
  # The migration Job runs before the release's other resources exist, so the Secret
  # it reads has to be created as part of the same hook phase.
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.database.postgres.url }}
  database-url: {{ .Values.database.postgres.url | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  oidc-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.cookieKey }}
  cookie-key: {{ . | quote }}
  {{- end }}
{{- end }}
