{{- if eq (include "sitrep.migrationMode" .) "job" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sitrep.fullname" . }}-migrate
  labels:
    {{- include "sitrep.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Helm runs these before install/upgrade; ArgoCD maps them to PreSync hooks.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "sitrep.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Deliberately the namespace default SA: the chart-managed SA does not exist yet during pre-install.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "sitrep.image" . | quote }}
          imagePullPolicy: {{ include "sitrep.pullPolicy" . }}
          args: ["migrate", "up"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "sitrep.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
