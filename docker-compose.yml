name: sitrep
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    image: postgres:16
    networks:
      default: null
    restart: always
    volumes:
      - type: volume
        source: db_data
        target: /var/lib/postgresql/data
        volume: {}
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
  dex:
    image: docker.io/dexidp/dex:latest
    environment:
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      DEX_CONNECTORS_ENABLE_MOCK: "true"
      DEX_CONNECTORS_ENABLE_DEMO_USER: "true"
      DEX_ISSUER: http://localhost:5556/dex
    networks:
      default: null
    command: dex serve /etc/dex/config-demo.yaml
    volumes:
      - type: bind
        source: ./example/dexidp/config-demo.yaml
        target: /etc/dex/config-demo.yaml
        read_only: true
      - type: volume
        source: dex_data
        target: /var/dex
        volume: {}
    ports:
      - mode: ingress
        target: 5556
        published: "5556"
        protocol: tcp
      - mode: ingress
        target: 5557
        published: "5557"
        protocol: tcp
networks:
  default:
    name: sitrep_default
volumes:
  db_data:
    name: sitrep_db_data
  dex_data:
    name: sitrep_dex_data
